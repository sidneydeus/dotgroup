version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot-backend
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload